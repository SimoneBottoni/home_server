x-base: &base
  restart: unless-stopped
  pull_policy: always
  logging:
    options:
      max-size: 10m
      max-file: "3"

x-common: &common
  <<: *base
  networks:
    - ron-net
  labels:
    - docker-volume-backup.stop-during-backup=true
  depends_on:
    - pihole

x-arr-env: &arr-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

services:
  # https://docs.portainer.io/start/install-ce/server/docker/linux
  portainer:
    <<: *common
    image: portainer/portainer-ce:lts
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LOCAL_PATH}/portainer/data:/data

  # https://gethomepage.dev/installation/docker/
  homepage:
    <<: *common
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      <<: *arr-env
      HOMEPAGE_ALLOWED_HOSTS: homepage.ron.home
    volumes:
      - ${LOCAL_PATH}/homepage:/app/config

  # https://github.com/pi-hole/docker-pi-hole
  pihole:
    <<: *base
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PSW}
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_upstreams: 1.1.1.1;1.0.0.1;8.8.8.8;8.8.4.4
    volumes:
      - ${LOCAL_PATH}/pihole:/etc/pihole
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    networks:
      - ron-net
    labels:
      - docker-volume-backup.stop-during-backup=true

  # https://hub.docker.com/r/homeassistant/home-assistant
  # Host network (device discovery), so not on ron-net: proxy to <server IP>:8123
  home-assistant:
    <<: *base
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant
    environment:
      TZ: ${TZ}
    volumes:
      - ${LOCAL_PATH}/home-assistant/config:/config
      - /run/dbus:/run/dbus:ro
    privileged: true
    network_mode: host
    labels:
      - docker-volume-backup.stop-during-backup=true
    depends_on:
      - pihole

  # https://docs.linuxserver.io/images/docker-jellyfin/
  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *arr-env
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLISHEDSERVERURL}
      DOCKER_MODS: linuxserver/mods:jellyfin-opencl-intel
    volumes:
      - ${LOCAL_PATH}/jellyfin/config:/config
      - ${NAS_PATH}/tv_shows:/data/tvshows
      - ${NAS_PATH}/anime:/data/anime
      - ${NAS_PATH}/movies:/data/movies
      - /dev/shm:/transcode
    ports:
      - "7359:7359/udp" # Client discovery
    group_add:
      - "${RENDER_GID:-992}" # Host render group, for /dev/dri
    devices:
      - /dev/dri:/dev/dri

  # https://docs.linuxserver.io/images/docker-prowlarr
  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment: *arr-env
    volumes:
      - ${LOCAL_PATH}/prowlarr/data:/config

  # https://docs.linuxserver.io/images/docker-sonarr/
  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment: *arr-env
    volumes:
      - ${LOCAL_PATH}/sonarr/data:/config
      - ${NAS_PATH}/tv_shows:/tv_shows
      - ${NAS_PATH}/anime:/anime
      - ${DOWNLOAD_PATH}:/downloads

  # https://github.com/MainKronos/Sonarr-AnimeDownloader
  sonarr_anime:
    <<: *common
    image: ghcr.io/mainkronos/anime_downloader:latest
    container_name: sonarr_anime
    environment:
      <<: *arr-env
      SONARR_URL: http://sonarr:8989
      ANIMEWORLD_URL: https://www.animeworld.ac
      API_KEY: ${SONARR_APIKEY}
    volumes:
      - ${LOCAL_PATH}/sonarr_anime/data:/src/database
      - ${NAS_PATH}/anime:/anime
      - ${DOWNLOAD_PATH}/anime:/downloads
      - ${LOCAL_PATH}/sonarr_anime/connections:/src/script

  # https://docs.linuxserver.io/images/docker-radarr
  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment: *arr-env
    volumes:
      - ${LOCAL_PATH}/radarr/data:/config
      - ${NAS_PATH}/movies:/movies
      - ${DOWNLOAD_PATH}:/downloads

  # https://docs.linuxserver.io/images/docker-bazarr/#usage
  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment: *arr-env
    volumes:
      - ${LOCAL_PATH}/bazarr/config:/config
      - ${NAS_PATH}/movies:/movies
      - ${NAS_PATH}/tv_shows:/tv_shows
      - ${NAS_PATH}/anime:/anime

  # https://docs.linuxserver.io/images/docker-qbittorrent/
  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *arr-env
      WEBUI_PORT: "8088"
      TORRENTING_PORT: "6881"
    volumes:
      - ${LOCAL_PATH}/qbittorrent:/config
      - ${DOWNLOAD_PATH}:/downloads
    ports:
      - "6881:6881"
      - "6881:6881/udp"

  # https://github.com/NginxProxyManager/nginx-proxy-manager
  nginx-proxy:
    <<: *common
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy
    environment:
      <<: *arr-env
      DISABLE_IPV6: "true"
    volumes:
      - ${LOCAL_PATH}/nginx-proxy/data:/data
      - ${LOCAL_PATH}/nginx-proxy/letsencrypt:/etc/letsencrypt
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
      - "81:81" # Admin UI

  # https://tailscale.com/docs/features/containers/docker
  tailscale:
    <<: *base
    image: tailscale/tailscale:latest
    container_name: tailscale
    network_mode: host
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_HOSTNAME: home-server
      # Makes the server's LAN IP reachable remotely, so the pihole *.ron.home records keep working
      TS_ROUTES: ${SERVER_IP}/32
    volumes:
      - ${LOCAL_PATH}/tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - pihole

  # https://watchtower.nickfedor.com/
  watchtower:
    <<: *base
    image: nickfedor/watchtower:latest
    container_name: watchtower
    environment:
      TZ: ${TZ}
      WATCHTOWER_SCHEDULE: "0 0 5 1 * *" # 1st of the month, 05:00
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ron-net
    depends_on:
      - pihole

  # https://offen.github.io/docker-volume-backup/
  backup:
    <<: *base
    image: offen/docker-volume-backup:v2
    container_name: backup
    network_mode: none
    environment:
      TZ: ${TZ}
      BACKUP_CRON_EXPRESSION: "0 4 * * 1" # Monday 04:00
      BACKUP_FILENAME: services-%Y-%m-%d.tar.gz
      BACKUP_PRUNING_PREFIX: services-
      BACKUP_RETENTION_DAYS: "28"
      BACKUP_EXCLUDE_REGEXP: jellyfin/config/cache
    volumes:
      - ${LOCAL_PATH}:/backup/services:ro
      - ${NAS_PATH}/backups:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  ron-net:
    driver: bridge
